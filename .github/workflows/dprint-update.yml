# .github/workflows/dprint-update.yml
#
# Pin dprint plugin manifest to a weekly cron + auto-open a PR if
# anything drifts. See #236.
#
# Implementation:
# - Mondays 09:00 UTC, run `npx dprint config update -y` which bumps
#   every plugin in dprint.json to its latest version.
# - Apply any formatting changes from new plugin rules via `npx dprint fmt`.
# - If anything changed, open a PR via peter-evans/create-pull-request.
# - If nothing changed, exit clean (no PR, no spam).
name: dprint Plugin Updates

on:
  # Mondays 09:00 UTC. Anchored to a weekday morning so reviewers see it
  # in their workday queue rather than over a weekend.
  schedule:
    - cron: "0 9 * * 1"
  # Manual trigger for ad-hoc bumps or testing.
  workflow_dispatch:

# Cancel any in-flight runs if a new dispatch arrives. Manual +
# cron can theoretically overlap if a manual `gh workflow run` is
# triggered while the weekly cron job is still running.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# Read-only by default; the bump job takes the two writes it needs.
permissions: {}

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push chore/dprint-plugin-update
      pull-requests: write # open the auto-PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install from the lockfile rather than naming a dprint version here.
      # A hardcoded range silently goes stale every time package.json moves,
      # and then the bump runs under a different formatter than the one
      # `just fmt` and the lefthook pre-commit hook use — so the PR it opens
      # would not match what a developer reproduces locally.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - name: Install dependencies
        run: npm ci

      # Bump every plugin in dprint.json to current latest.
      # Output: deterministic diff to dprint.json. -y = non-interactive.
      - name: Bump dprint plugins
        run: npx dprint config update -y

      # New plugin versions may have tighter formatting rules. Apply
      # any drift they introduce to existing files so the diff in the
      # PR shows just the version bump + rule conformance, not mixed
      # noise.
      - name: Apply formatting from new plugin rules
        run: npx dprint fmt

      # Detect drift across the whole tree. Empty tree = no PR.
      - name: Detect drift
        id: drift
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Every dprint plugin is already at its latest version."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Files changed:"
            git status --short
          fi

      # Stands in for the CI this PR will not get. A plugin bump reformats
      # files, which should be incapable of changing behaviour — but "should
      # be" is exactly the kind of claim worth checking when nothing
      # downstream will.
      - name: Verify the reformatted tree
        if: steps.drift.outputs.changed == 'true'
        run: |
          npx tsc --noEmit
          npx vitest run

      # Opened by Actions, which needs the repository setting "Allow GitHub
      # Actions to create and approve pull requests" to be on. It is.
      #
      # The cost of that choice, recorded so nobody rediscovers it: GitHub
      # does not run workflows for a PR opened with GITHUB_TOKEN, to prevent
      # recursion. This PR therefore arrives with no checks on it, which is
      # why the job verifies the bump itself in the step above and why the PR
      # body says how to check it locally (#537).
      - name: Open PR
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "chore(deps): bump dprint plugins"
          commit-message: "chore(deps): bump dprint plugins via dprint config update"
          branch: chore/dprint-plugin-update
          delete-branch: true
          body: |
            Weekly dprint plugin bump via `npx dprint config update -y` +
            `npx dprint fmt`.

            See #236 for the rationale and the schedule.

            Auto-generated by `.github/workflows/dprint-update.yml`.

            **No checks will appear on this PR.** GitHub does not run
            workflows for pull requests opened by Actions. The job that
            created it ran `npx tsc --noEmit` and the unit suite against the
            reformatted tree first, so it is not unverified — but if you want
            the full matrix, push an empty commit to this branch.

            To check it locally: `npm ci && npx dprint check`.
