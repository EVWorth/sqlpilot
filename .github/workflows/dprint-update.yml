# .github/workflows/dprint-update.yml
#
# Pin dprint plugin manifest to a weekly cron + auto-open a PR if
# anything drifts. See #236.
#
# Implementation:
# - Mondays 09:00 UTC, run `npx dprint config update -y` which bumps
#   every plugin in dprint.json to its latest version.
# - Apply any formatting changes from new plugin rules via `npx dprint fmt`.
# - If anything changed, open a PR via peter-evans/create-pull-request.
# - If nothing changed, exit clean (no PR, no spam).
name: dprint Plugin Updates

on:
  # Mondays 09:00 UTC. Anchored to a weekday morning so reviewers see it
  # in their workday queue rather than over a weekend.
  schedule:
    - cron: "0 9 * * 1"
  # Manual trigger for ad-hoc bumps or testing.
  workflow_dispatch:

# Cancel any in-flight runs if a new dispatch arrives. Manual +
# cron can theoretically overlap if a manual `gh workflow run` is
# triggered while the weekly cron job is still running.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# Nothing for GITHUB_TOKEN. The branch push and the PR are both made with a
# GitHub App installation token instead — see the preflight step below for
# why, and docs/CI.md for the one-time setup.
permissions: {}

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      # Fail here, loudly and specifically, rather than letting the token step
      # produce something opaque. Until the App exists this workflow cannot do
      # its job, and a scheduled job that cannot do its job should say so — a
      # weekly red X nobody can explain is how the last defect in this file
      # survived for months (#534).
      - name: Preflight — App credentials present
        env:
          APP_ID: ${{ secrets.DPRINT_BOT_APP_ID }}
          PRIVATE_KEY: ${{ secrets.DPRINT_BOT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -z "${APP_ID}" ] && missing="${missing} DPRINT_BOT_APP_ID"
          [ -z "${PRIVATE_KEY}" ] && missing="${missing} DPRINT_BOT_PRIVATE_KEY"
          if [ -n "${missing}" ]; then
            echo "Missing repository secret(s):${missing}" >&2
            echo "This workflow opens its PR as a GitHub App, not as Actions." >&2
            echo "One-time setup: docs/CI.md, 'Automation identity'." >&2
            exit 1
          fi

      # Why an App rather than GITHUB_TOKEN:
      #
      # - GITHUB_TOKEN cannot open a PR unless the repository setting "Allow
      #   GitHub Actions to create and approve pull requests" is on. That
      #   switch also grants Actions the ability to *approve* PRs, which would
      #   become a review-requirement bypass the moment branch protection is
      #   added to main. Not worth turning on for a formatter bump (#537).
      # - PRs opened with GITHUB_TOKEN do not trigger workflow runs, by design,
      #   to prevent recursion. The bump would arrive with no CI on it at all.
      #   An App token is not GITHUB_TOKEN, so the PR gets the full suite.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DPRINT_BOT_APP_ID }}
          private-key: ${{ secrets.DPRINT_BOT_PRIVATE_KEY }}

      # Checked out with the App token too, so the push that create-pull-request
      # makes uses the same identity that opens the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      # Install from the lockfile rather than naming a dprint version here.
      # A hardcoded range silently goes stale every time package.json moves,
      # and then the bump runs under a different formatter than the one
      # `just fmt` and the lefthook pre-commit hook use — so the PR it opens
      # would not match what a developer reproduces locally.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - name: Install dependencies
        run: npm ci

      # Bump every plugin in dprint.json to current latest.
      # Output: deterministic diff to dprint.json. -y = non-interactive.
      - name: Bump dprint plugins
        run: npx dprint config update -y

      # New plugin versions may have tighter formatting rules. Apply
      # any drift they introduce to existing files so the diff in the
      # PR shows just the version bump + rule conformance, not mixed
      # noise.
      - name: Apply formatting from new plugin rules
        run: npx dprint fmt

      # Detect drift across the whole tree. Empty tree = no PR.
      - name: Detect drift
        id: drift
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Files changed:"
            git status --short
          fi

      - name: Open PR
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          title: "chore(deps): bump dprint plugins"
          commit-message: "chore(deps): bump dprint plugins via dprint config update"
          branch: chore/dprint-plugin-update
          delete-branch: true
          body: |
            Weekly dprint plugin bump via `npx dprint config update -y` +
            `npx dprint fmt`.

            See #236 for the rationale and the schedule.

            Auto-generated by `.github/workflows/dprint-update.yml`. Review
            locally with `npm ci && npx dprint check` before merging.

            Opened by the repo's automation App rather than by Actions, so CI
            runs on this PR — see docs/CI.md.
