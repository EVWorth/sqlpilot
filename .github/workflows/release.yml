name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Cancel in-flight runs when a new release dispatch arrives (e.g.
# tag re-pushed, manual re-run). Keyed by workflow + ref: for a tag push
# that is the tag, for a manual dispatch the branch it was run from, so
# concurrent releases don't collide.
#
# The fallbacks this used to carry were dead. `workflow_dispatch` declares
# no inputs, so `github.event.inputs.tag` never held anything, and
# `github.ref` is always set, so nothing after the first `||` could ever
# be reached.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate tag matches manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run release readiness check
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          echo "Validating tag v${TAG} against working tree manifests..."
          bash scripts/check-release-readiness.sh "${TAG}"

  # The tests that need a live server. They are #[ignore]d so ordinary CI stays
  # container-free, which means this job is the only thing that runs them —
  # `build` depends on it, so a database regression blocks the release rather
  # than shipping. Coverage is produced here too, for the same reason.
  integration-db:
    name: Database integration tests
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --protocol=TCP -u root -ptest_root_password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # MariaDB spells EXPLAIN ANALYZE as `ANALYZE` and answers in a different
      # shape, so the explain tests need a real one to run against (#422).
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test_root_password
          MARIADB_DATABASE: test_db
          MARIADB_USER: test_user
          MARIADB_PASSWORD: test_password
        ports:
          - 13308:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 --protocol=TCP -u root -ptest_root_password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read pinned Rust version
        id: rust-toolchain-file
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.rust-toolchain-file.outputs.channel }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Seed test databases
        run: |
          mysql -h 127.0.0.1 -P 13306 -u root -ptest_root_password < tests/fixtures/sql/seed.sql
          mysql -h 127.0.0.1 -P 13308 -u root -ptest_root_password < tests/fixtures/sql/seed.sql
      # Twice: once against each server. Every integration file takes
      # MAS_TEST_PORT, and running them against MariaDB is what found a
      # connection lost after every query timeout (#658) and JSON columns
      # arriving as binary. Neither showed on MySQL.
      - name: Run database integration tests (MySQL 8)
        run: cargo test -p mas-core -p mas-admin -p mas-mcp -- --ignored --test-threads=1
        working-directory: src-tauri
      - name: Run database integration tests (MariaDB 11)
        env:
          MAS_TEST_PORT: "13308"
        run: cargo test -p mas-core -p mas-admin -p mas-mcp -- --ignored --test-threads=1
        working-directory: src-tauri
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Run full suite with coverage
        run: cargo tarpaulin -p mas-core -p mas-export -p mas-admin -p mas-mcp --out Lcov --output-dir coverage/ -- --include-ignored
        working-directory: src-tauri
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage
          path: src-tauri/coverage/

  # Build only — does NOT create a release. Each matrix job produces platform
  # bundles and uploads them as workflow artifacts. The `upload` job
  # below is the single source of release creation, eliminating the
  # tauri-action@v1.0.0 race that produced duplicate GitHub Releases.
  build:
    needs: [validate, integration-db]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
            rust_target: x86_64-unknown-linux-gnu
            artifact_suffix: linux-x86_64
          - platform: windows-latest
            args: ""
            rust_target: x86_64-pc-windows-msvc
            artifact_suffix: windows-x86_64
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
            artifact_suffix: macos-aarch64
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_target: x86_64-apple-darwin
            artifact_suffix: macos-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Read pinned Rust version
        id: rust-toolchain-file
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          # From rust-toolchain.toml, so releases build on the same version
          # CI tests against.
          toolchain: ${{ steps.rust-toolchain-file.outputs.channel }}
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure Windows code signing
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "No Windows signing certificate configured, skipping..."
            exit 0
          }
          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx | Out-Null
          Remove-Item certificate/tempCert.txt
          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $config.bundle | Add-Member -Force -MemberType NoteProperty -Name windows -Value ([pscustomobject]@{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = 'sha256'
            timestampUrl = 'http://timestamp.digicert.com'
          })
          $config | ConvertTo-Json -Depth 100 | Set-Content src-tauri/tauri.conf.json

      # Build-only mode: omit tagName/releaseName/releaseId. Per tauri-action@v1.0.0
      # README: "If you only want to build the app without having the action upload
      # any assets, for example if you want to only use actions/upload-artifact,
      # simply omit tagName, releaseName and releaseId."
      - name: Build bundles (no release)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: ${{ matrix.args }}

      # Stage the Windows portable exe under its public name so the upload job
      # can publish it as `SQLPilot.exe` (matches the historical asset name).
      - name: Stage portable exe (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/sqlpilot.exe"
          $dest = "SQLPilot.exe"
          if (-not (Test-Path $exe)) { throw "Expected binary not found: $exe" }
          Copy-Item $exe $dest -Force

      # Upload every artifact the upload job will need: the bundle tree
      # (containing .deb/.rpm/.AppImage/.msi/.exe/.dmg + .sig) and, on
      # Windows, the staged portable exe at the repo root.
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles-${{ matrix.artifact_suffix }}
          path: |
            src-tauri/target/release/bundle/
            SQLPilot.exe
          if-no-files-found: error

  # Single source of release creation. All 4 build jobs race to complete,
  # but only this job touches the GitHub Releases API — no race possible.
  upload:
    name: Create release and upload assets
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft release and upload assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: "SQLPilot ${{ github.ref_name }}"
          body: |
            ## Downloads
            | Platform | File |
            |----------|------|
            | Windows (portable) | `SQLPilot.exe` |
            | Windows (installer) | `.msi` or `-setup.exe` |
            | macOS (Apple Silicon) | `aarch64.dmg` |
            | macOS (Intel) | `x64.dmg` |
            | Linux | `.deb` or `.AppImage` |
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.sig
            artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  generate-update-manifest:
    name: Generate update manifest
    needs: [upload]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No Node and no signing key here. The bundles were signed during the
      # build, so this job only reads the .sig files already beside them —
      # which keeps the signing key out of a job that talks to the releases
      # API.
      - name: Download release artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download ${{ github.ref_name }}
      - name: Build the update manifest
        run: |
          TAG="${{ github.ref_name }}"
          scripts/build-update-manifest.sh "${TAG#v}" "$TAG" . latest.json

      - name: Upload update manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} latest.json --clobber
