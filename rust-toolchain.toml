# Single source of truth for the Rust toolchain.
#
# Read natively by rustup, by dtolnay/rust-toolchain in CI, and by mise.
# Pinned to an exact version rather than "stable": SQLPilot is an
# application, not a published library, so a reproducible build matters
# more than a wide MSRV — and an unpinned toolchain means a new stable
# release can turn CI red overnight with no code change.
[toolchain]
channel = "1.95.0"
components = ["rustfmt", "clippy"]
