# Toolchains and dev tools, so `mise install` is the one command a new
# contributor runs before `just <task>`.
#
# CI does NOT depend on mise — it reads .node-version and rust-toolchain.toml
# directly via actions/setup-node and dtolnay/rust-toolchain, so those two
# files stay the source of truth and nothing here can drift from them.
#
# Note: mise can read those idiomatic files itself, but that is off by
# default (idiomatic_version_file_enable_tools), so the versions are
# restated here. Keep them in sync — scripts/setup.sh checks that they match.
#
# Deliberately absent: dprint, lefthook, typescript, vitest, playwright.
# Those are pinned exactly by package-lock.json and installed by `npm ci`.
# Listing them here too would create a second source of truth that can
# silently disagree with the lockfile.
[tools]
node = "24"
rust = "1.95.0"
# The task runner. Every task lives in the justfile; `just --list` is the
# discovery path. Pinned to a major so recipe syntax cannot shift underneath
# the repo on a contributor's fresh install.
just = "1"
# Workflow linter. Unlike the tools above, CI does not have its own pin for
# this — the `Lint (workflows)` job reads the version from right here, so a
# bump moves both at once and `just lint-workflows` matches what CI runs.
# The job also verifies a sha256 recorded next to it in ci.yml; bump the two
# together, or the download fails its checksum (loudly, which is the point).
actionlint = "1.7.12"
